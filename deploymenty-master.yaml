apiVersion: v1
kind: Service

metadata:
  name: backend-service
spec:
  type: NodePort
  ports:
    - protocol: 'TCP'
      port: 80
      targetPort: 8080
      nodePort: 31471
  selector:
      app: second-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: second-app-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: second-app
      tier: backend 
  template:
    metadata:
      labels:
        app: second-app
        tier: backend
    spec:
      containers:
        - name: second-app-container
          image: seatsokhy/kub-first-app:v2
          ports:
            - containerPort: 8080
